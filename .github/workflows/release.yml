name: Release

# release-please keeps a release PR up to date on main: the changelog and the version, from the Conventional Commits.
# Merging it creates the tag and a draft release, which the publish job checks, builds, fills and publishes.
on:
  push:
    branches: [main]
  # Publishes a draft release made by hand, such as a pre-release. A draft gets no tag until published, so push the tag first:
  # git push origin <sha>:refs/tags/<tag>, then gh release create <tag> --verify-tag --draft --prerelease
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to publish
        required: true

concurrency:
  group: release

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PR opened with the GITHUB_TOKEN runs no workflow, and main requires the CI checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    needs: release-please
    # always(): on workflow_dispatch, release-please is skipped.
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # pnpm/action-setup reads the version from packageManager in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm lint
          pnpm knip
          pnpm i18n
          pnpm format:check
          pnpm typecheck
          pnpm test

      - name: Build Project
        run: pnpm build

      - name: Pin the Manifest to this Release
        run: node build/pinRelease.ts "$GITHUB_REPOSITORY" "$TAG"

      - name: Zip System
        working-directory: dist
        run: zip -r ../genesys.zip .

      # The manifest and download URLs of yaml/system.yml point to these names in the latest release.
      - name: Attach the System
        run: |
          cp dist/system.json manifest.json
          gh release upload "$TAG" manifest.json genesys.zip --clobber

      # A pre-release stays out of releases/latest, which Foundry reads for updates.
      - name: Publish the Release
        run: |
          if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true ]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
