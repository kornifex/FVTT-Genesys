name: GitHub Release

on:
  push:
    branches: [release]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # pnpm/action-setup reads the version from packageManager in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm release

      - name: Identify Version Number
        id: version
        run: echo "version=$(node ./build/version.js)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: false
          prerelease: false
          release_name: ${{ steps.version.outputs.version }}
          tag_name: release-${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md

      - name: Upload manifest.json
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/system.json
          asset_name: manifest.json
          asset_content_type: application/json

      - name: Upload System Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./genesys-${{ steps.version.outputs.version }}.zip
          asset_name: genesys.zip
          asset_content_type: application/zip
