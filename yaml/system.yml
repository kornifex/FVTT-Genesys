id: genesys
title: Genesys
description: (ALPHA) Unofficial implementation of EDGE Studio's Genesys RPG System.
version: 0.4.1 # x-release-please-version
compatibility:
  minimum: 12
  verified: 13
  maximum: 13
authors:
  - name: Mezryss
  - name: Assembling Kings
  - name: kornifex
    url: https://github.com/kornifex
# v12: only v12 needs the polyfill, its folder in public/scripts and its credit in README.md. Foundry v12 accepts
# Safari 15.4, which has no container queries; v13 requires Safari 18.4.
scripts:
  - scripts/container-query-polyfill/container-query-polyfill.modern.js
esmodules:
  - Genesys.js
styles:
  - style.css
languages:
  - lang: en
    name: English
    path: lang/en.json
  - lang: fr
    name: Français
    path: lang/fr.json
  - lang: es
    name: Español
    path: lang/es.json
packs:
  - name: crb-skills
    label: Core Skills
    system: genesys
    path: ./packs/crb-skills.db
    type: Item
socket: true
url: https://github.com/kornifex/FVTT-Genesys
bugs: https://github.com/kornifex/FVTT-Genesys/issues
changelog: https://github.com/kornifex/FVTT-Genesys/blob/main/CHANGELOG.md
license: https://github.com/kornifex/FVTT-Genesys/blob/main/LICENSE
manifest: https://github.com/kornifex/FVTT-Genesys/releases/latest/download/manifest.json
download: https://github.com/kornifex/FVTT-Genesys/releases/latest/download/genesys.zip
