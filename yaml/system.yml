id: genesys
title: Genesys
description: (ALPHA) Unofficial implementation of EDGE Studio's Genesys RPG System.
version: 0.4.0-rc.1 # x-release-please-version
compatibility:
  minimum: 13
  verified: 14
authors:
  - name: Mezryss
  - name: Assembling Kings
  - name: kornifex
    url: https://github.com/kornifex
esmodules:
  - Genesys.js
styles:
  - style.css
languages:
  - lang: en
    name: English
    path: lang/en.json
  - lang: fr
    name: Français
    path: lang/fr.json
  - lang: es
    name: Español
    path: lang/es.json
packs:
  - name: crb-skills
    label: Core Skills
    system: genesys
    path: ./packs/crb-skills
    type: Item
documentTypes:
  # Each type's data is defined by its DataModel, registered in CONFIG.Actor.dataModels and CONFIG.Item.dataModels.
  Actor:
    character: {}
    minion: {}
    rival: {}
    nemesis: {}
    vehicle: {}
  Item:
    # Equipment
    armor: {}
    consumable: {}
    container: {}
    gear: {}
    quality: {}
    weapon: {}
    vehicleWeapon: {}

    # Character Building
    ability: {}
    archetype: {}
    career: {}
    injury: {}
    skill: {}
    talent: {}
socket: true
url: https://github.com/kornifex/FVTT-Genesys
bugs: https://github.com/kornifex/FVTT-Genesys/issues
changelog: https://github.com/kornifex/FVTT-Genesys/blob/main/CHANGELOG.md
license: https://github.com/kornifex/FVTT-Genesys/blob/main/LICENSE
manifest: https://github.com/kornifex/FVTT-Genesys/releases/latest/download/manifest.json
download: https://github.com/kornifex/FVTT-Genesys/releases/latest/download/genesys.zip
