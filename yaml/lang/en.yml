TYPES:
  Actor:
    character: Character
    minion: Minion
    rival: Rival
    nemesis: Nemesis
    vehicle: Vehicle

  Item:
    # Character Creation Items
    ability: Special Ability
    archetype: Archetype
    career: Career
    injury: Critical Injury/Hit
    skill: Skill
    talent: Talent

    # Magic Items
    additionalEffect: Additional Effect
    spell: Spell

    # Equipment Items
    armor: Armor
    attachment: Attachment
    consumable: Consumable
    container: Container
    gear: Gear
    quality: Item Quality
    weapon: Weapon
    vehicleWeapon: Vehicle Weapon

# Genesys
Genesys:
  # System Strings
  System:
    Name: Genesys

  # System Settings
  Settings:
    SkillsCompendium: Skills Compendium
    SkillsCompendiumHint: An Item compendium containing all of the skills that should be applied to new characters. Changing this value will have no impact on existing characters.
    DefaultDifficulty: Default Difficulty
    DefaultDifficultyHint: >-
      The default dice pool modifications that should be added to the dice pool when doing a check. This default might be ignored in cases were the difficulty is known.
      For an explanation of all the possible modifications and their glyph please check [[Dice-Pool-Modification-Glyphs|Dice Pool Modification Glyphs]].
    Money: Currency Label
    MoneyHint: The name (such as Gold, Credits, Cash, Doubloons, etc) used for Currency in the system.
    CareerSkillRanks: Career Skill Ranks
    CareerSkillRanksHint: Number of skills you can select from your Career Skills list during character creation.
    UncoupleSkillsAlternateRule: Uncouple Skills from Characteristics
    UncoupleSkillsAlternateRuleHint: Allows selecting an alternative Characteristic for a skill in the dice prompt window, per the Uncoupling Skills from Characteristics alternate rule (Core Rulebook, p.205).
    ShowDamageOnFailure: Show Attack Damage On Failure
    ShowDamageOnFailureHint: Whether to show Damage and Critical on attack roll chat cards even when the roll was a failure. Qualities always show, since some trigger on a failure.
    SkillForInjuries: Resilience Skill Name
    SkillForInjuriesHint: Name of the skill used when recovering from Critical Injuries.
    SkillForRepairingVehicleHits: Mechanics Skill Name
    SkillForRepairingVehicleHitsHint: Name of the skill used when recovering from Critical Hits.
    DicePoolCollapseModifications: Collapse the Pool Modifications Section
    DicePoolCollapseModificationsHint: If enabled the 'Pool Modifications' section on the dice pool prompt will be collapsed during the initial render.
    DicePoolAutoApplyModifications: Auto-Apply Pool Modifications
    DicePoolAutoApplyModificationsHint: If enabled all the modifications that can affect the dice pool will be applied when opening the dice pool prompt.
    DicePoolChanceToSucceedByPermutation: Calculate the Chance to Succeed for Dice Pools
    DicePoolChanceToSucceedByPermutationHint: >-
      If enabled this will spawn a Web Worker that calculates the exact chance to succeed.
      However, if the dice pool uses a super-characteristic the calculated value is lower than the true value because it assumes that the pool doesn't explode.
      For dice pools that use super-characteristics you can get a more accurate value by using simulations.
    DicePoolChanceToSucceedBySimulation: Approximate the Chance to Succeed for Dice Pools
    DicePoolChanceToSucceedBySimulationHint: >-
      The number of simulated rolls to run in order to approximate the chance to succeed.
      Be mindful when increasing this number since it will have a direct impact on Foundry's performance; a good number to start is 100. If a value of 0 is provided this feature is disabled.
      This setting is ignored if the chance is already being calculated some other way.
    SuperCharacteristics: Super-Characteristics
    SuperCharacteristicsHint: Allows marking characteristics as being 'super' during character creation, per the Super-Characteristics optional rule (Core Rulebook, p.251).
    IgnoreTalentPyramid: Ignore Talent Pyramid
    IgnoreTalentPyramidHint: 'House rule: allows purchasing talents of any tier without having enough talents of the tier below.'
    TalentTierVersions: Talent Tiers as Separate Versions
    TalentTierVersionsHint: "House rule: each tier of a ranked talent is a separate item with the same name. Dropping one on a character who already has the talent buys a rank at that item's tier × 5 XP, in any order, and the rank upgrade button is hidden."
    Style: Style
    StyleHint: 'The colors of the sheets and windows, for every user. Only colors change, never the layout.'
    StyleGenesys: Genesys
    StyleTerrinoth: Realms of Terrinoth
    CountError: must be a whole number, 0 or more
    DefaultDifficultyError: must be dice pool modification glyphs

  # Tooltips
  Tooltips:
    NoDescription: No Description Available
    SkillDifficulty: >-
      The difficulty the Dice Pool opens at for this skill, as dice pool modification glyphs (DD for Average). Leave it empty for the world's Default Difficulty. Only the skill of the Skills Compendium counts.
    HardPoints: >-
      Half the base encumbrance, rounded up (CRB p. 206). Change it for an item that is an exception; empty it to go back to the computed value.
    IsInitiative: Whether the skill is commonly used for Initiative or not. Setting this to true will make it appear as an option in the combat tracker for mass rolls.
    CycleInitiativeSkill: Cycle which initiative skill the combatant is using.
    AddExtraInitiativeSlot: Adds an extra initiative slot.
    Details: Details
    OpenSkill: Open the skill's sheet
    OpenItem: Open the item's sheet
    OpenActor: Open the actor's sheet
    RollSkill: Roll {skill}
    RollAttack: Attack with {weapon}
    CastSpell: Cast {spell}
    RollHealing: Roll {skill} to heal {injury}
    RollRepair: Roll {skill} to repair {hit}
    RollCharacteristic: Roll {characteristic}

  # Dice Rolls
  Rolls:
    Dice: Dice
    Results: Roll Results
    Description:
      Simple: 'Rolling<i class="fas fa-star {superChar}"></i>...'
      Initiative: 'Rolling Initiative with <strong>{skill}<i class="fas fa-star {superChar}"></i></strong>...'
      Characteristic: Rolling <strong>{characteristic}</strong>...
      Skill: 'Rolling <strong>{skill} ({characteristic}<i class="fas fa-star {superChar}"></i>)</strong>...'
      SkillWithoutCharacteristic: Rolling <strong>{skill}</strong>...
      AttackCharacteristic: Attacking with <strong>{name}</strong> using <strong>{characteristic}</strong>!
      AttackSkill: 'Attacking with <strong>{name}</strong> using <strong>{skill} ({characteristic}<i class="fas fa-star {superChar}"></i>)</strong>!'
      AttackSkillWithoutCharacteristic: Attacking with <strong>{name}</strong> using <strong>{skill}</strong>!
      SpellSkill: 'Casting <strong>{name}</strong> using <strong>{skill} ({characteristic}<i class="fas fa-star {superChar}"></i>)</strong>!'
      SpellSkillWithoutCharacteristic: Casting <strong>{name}</strong> using <strong>{skill}</strong>!
      SpellWithoutSkill: Casting <strong>{name}</strong>!
    Spell:
      AdditionalEffects: Additional Effects
      Strain: Strain suffered by the caster
    Attack:
      Critical: Critical
      Label: Attack Results
      Damage: Damage
      Qualities: Attack Qualities
    Summary:
      Label: Summary
      Successes: Successes
      Failures: Failures
      Advantage: Advantage
      Threat: Threat
      Triumph: Triumph
      Despair: Despair

  # Career Skill Prompt
  CareerSkillPrompt:
    Title: Career Skills
    Hint: 'Select Career Skills to gain a rank:'
    RemainingChoices: Remaining Choices
    Confirm: Done

  # Dice So Nice strings
  DiceCat:
    Normal: Genesys Dice
    Custom: Genesys Dice (Customizable)
  DiceColors:
    Boost: Boost Die
    Ability: Ability Die
    Proficiency: Proficiency Die
    Setback: Setback Die
    Difficulty: Difficulty Die
    Challenge: Challenge Die

  # The dice and symbols in words, as a screen reader and a tooltip read them
  Symbols:
    Proficiency:
      one: '{count} Proficiency die'
      other: '{count} Proficiency dice'
    Ability:
      one: '{count} Ability die'
      other: '{count} Ability dice'
    Boost:
      one: '{count} Boost die'
      other: '{count} Boost dice'
    Challenge:
      one: '{count} Challenge die'
      other: '{count} Challenge dice'
    Difficulty:
      one: '{count} Difficulty die'
      other: '{count} Difficulty dice'
    Setback:
      one: '{count} Setback die'
      other: '{count} Setback dice'
    Triumph:
      one: '{count} Triumph'
      other: '{count} Triumphs'
    Success:
      one: '{count} Success'
      other: '{count} Successes'
    Advantage:
      one: '{count} Advantage'
      other: '{count} Advantage'
    Despair:
      one: '{count} Despair'
      other: '{count} Despair'
    Failure:
      one: '{count} Failure'
      other: '{count} Failures'
    Threat:
      one: '{count} Threat'
      other: '{count} Threat'
  Glyphs:
    BlankFace: Blank face
    DieResult: '{die}: {face}' # e.g. Ability Die: 1 Success, 1 Advantage
    Operations:
      Add: Add {glyphs}
      Remove: Remove {glyphs}
      Upgrade: Upgrade {glyphs}
      Downgrade: Downgrade {glyphs}

  # Difficulty Ranks
  Difficulty:
    Simple: Simple
    Easy: Easy
    Average: Average
    Hard: Hard
    Daunting: Daunting
    Formidable: Formidable
    Impossible: Impossible

  # ActiveEffects System Strings
  ActiveEffects:
    Passive: Passive Effects
    Temporary: Temporary Effects
    Suppressed: Inactive Effects
    Source: Source
    SuppressedAsConsumable: "Inactive: {item} is a consumable, whose effects don't apply."
    SuppressedByContainer: Inactive while {item} is in {container}.
    SuppressedByEquipmentState: Inactive while {item} is {state}.
    Duration: Duration
    Expired: Expired
    TurnOn: Turn the effect on
    TurnOff: Turn the effect off
    Types:
      ModifyCharacteristic: Modify Characteristic
      ModifyStat: Modify Stat
      ModifyDicePool:
        GroupLabel: Modify Dice Pool
        Options:
          Check: Any Check
          Characteristic: Uses Characteristic
          Skill: Uses Skill
          # The scopes of combat checks and attacks (CRB p. 98–100, 108)
          CombatCheck: Combat Check
          MeleeAttack: Melee Attack
          RangedAttack: Ranged Attack

  # Token States: the states of the token's status menu (CRB p. 114)
  TokenStates:
    Immobilized:
      Name: Immobilized
      Reminder: "Immobilized: can't perform maneuvers."
    Disoriented:
      Name: Disoriented
    Staggered:
      Name: Staggered
      Reminder: "Staggered: can't perform actions."
    Rounds: Rounds
    Apply: Apply
    RoundsLeft:
      one: '{rounds} round'
      other: '{rounds} rounds'
    # Cover and prone (CRB p. 99–100)
    Cover:
      Name: In Cover
    Prone:
      Name: Prone
    # Set and cleared by the Threshold States (CRB pp. 112–113)
    Incapacitated:
      Name: Incapacitated

  # Maneuvers: those of the character sheet's Combat tab (CRB p. 98–99)
  Maneuvers:
    Title: Maneuvers
    Aim:
      Name: Aim
      Hint: A Boost on the next combat check, two after two Aim maneuvers in a row.
    GuardedStance:
      Name: Guarded Stance
      Hint: A Setback on combat checks and melee defense 1, until the end of the next turn.

  # Threshold States: what wounds or strain past their threshold do (CRB pp. 112–113)
  ThresholdStates:
    CriticalInjuryOffer: '{actor} is past their wound threshold, incapacitated, and suffers a Critical Injury.'

  # Dice Prompt Labels
  DicePrompt:
    Title: Dice Pool
    OpenDiceRoller: Roll dice
    Roll: Roll!
    Hint: Use the dice box on the right to add, upgrade and downgrade. Click a die in the pool to remove one of its kind, after every other change.
    UseSuperCharacteristic: Roll as a super-characteristic
    UnrankedSkills: Unranked
    WeaponSkills: Weapon Skills
    SpellSkills: Spell Skills
    BeyondFormidable: Would take the difficulty beyond Formidable.
    PoolModifications:
      Title: Pool Modifications
      Cancel: 'Cancel: {modification}' # e.g. Cancel: Upgrade 1 Ability die
      Difficulty: 'Difficulty: {level}'
      ManualChanges: Manual Changes
      SelfEffects: 'From Self: '
      TargetEffects: 'From Target: '
      EffectOfItem: '{effect} ({item})'
      OpenSource: Open {name}
      SilhouetteDifference: Silhouette ({target} vs {attacker})
      Encumbrance: Encumbrance ({value} vs {threshold})
      ItemDamage: '{item} ({damage})' # e.g. Pistol (Minor Damage)
    # What a Story Point buys on the check, each followed by the short name of the pool it comes from.
    StoryPoints:
      Title: Story Points
      Impossible: Spend a point to attempt the Impossible task
      UpgradeAbility: Spend a point to upgrade the ability
      UpgradeDifficulty: Spend a player's point to upgrade the difficulty
      ImpossibleCost: An Impossible task can't be rolled without it.
      EmptyPool: The pool has no point left to spend.
      NoGM: A GM must be online to spend a Story Point.
    ChanceToSucceed: 'Chance to Succeed:'
    ChanceToSucceedByPermutationDisclaimer: The displayed probability is exact unless the dice pool includes a super-characteristic.
    ChanceToSucceedBySimulationDisclaimer: The displayed probability is an approximation that uses the Monte Carlo method.

  # Rolling a Critical Injury on the world's table (#685): its setting, the attack card's button, the effect changes and
  # the dialog.
  CriticalInjuryPrompt:
    Setting: Critical Injury Table
    SettingHint: >-
      The Roll Table a Critical Injury is rolled on, among the world's: its results are the world's Critical Injury items, and its ranges those of the d100 (Core Rulebook, p.115).
    NoTable: No Critical Injury table is set. The GM picks one in the system settings.
    NoResult: The Critical Injury table has no result for {total}.
    CardTriggers: Critical Injury Triggers
    Open: Roll a Critical Injury
    Title: Roll a Critical Injury
    For: Critical Injury for {actor}
    Attack: 'Attack: {weapon}'
    Table: 'Table: {table}'
    Spent: Triggers spent (of {triggers})
    Lines:
      Triggers: Extra triggers (+10 each past the first)
      Vicious: Vicious {rating}
      Injuries: Critical Injuries already suffered ({count})
      Inflicted: '{source} (attacker)'
      Suffered: '{source}'
      Free: Free modifier
    Formula: 'Roll:'
    Roll: Roll
    # The name of the Vicious quality in the world's language, which a weapon's quality is recognised by, as by its
    # English name.
    ViciousQuality: Vicious
    Message: Critical Injury
    MessageFor: 'Critical Injury: {actor}'
    Effects:
      GroupLabel: Modify Critical Injuries
      Inflicted: Inflicted on Others
      Suffered: Suffered

  # Rewards Prompt Labels
  RewardsPrompt:
    Title: Rewards
    Amount: Amount
    Reason: Reason

  # Crew Member Prompt Labels
  CrewMemberPrompt:
    Title: Select Crew Member

  # Recovery: the checks that heal a patient, and their cards
  Recovery:
    HealWithMedicine: Heal with Medicine
    PatientPrompt: Select Patient
    CardLabel: Heals {patient}
    Wounds: Wounds
    Strain: Strain
    Apply: Apply
    # The end of an encounter's check and a night's rest
    EndOfEncounter: End of encounter
    EndOfEncounterCardLabel: '{patient} recovers'
    NightsRest: Night's rest
    NightsRestMessage: 'Rests for the night. Strain recovered: {strain}. Wounds healed: {wounds}.'

  # Clone Actor Prompt Labels
  CloneActorPrompt:
    Title: Drop Confirmation
    OriginalMethod:
      Label: Reference
      Description: A reference to the actor will be saved.
    CloneMethod:
      Label: Clone
      Description: >-
        A clone of the dropped actor will be created and a reference to it will be saved.
        Additionally, the cloned actor will appear on the 'Actors' directory as a new entry with the name specified below.
      ActorNameLabel: New Name
    Method: Save the dropped actor as

  # Experience Journal Labels
  XPJournal:
    Award: '<strong>XP Awarded by GM</strong>: {reason}'
    Starting: <strong>Starting XP from Archetype</strong>
    Characteristic: Increased <strong>{characteristic}</strong> to {rank}.
    Skill: Increased <strong>{name}</strong> to {rank}.
    NewTalent: 'Purchased Talent: <strong>{name}</strong> (Tier {tier}).'
    TalentRank: Increased <strong>{name}</strong> to Rank {rank} (Effective Tier {tier}).
    AddEntry: Add an Experience Journal entry
    UndoEntry: Undo the entry

  # Notification Prompts
  Notifications:
    GenericError: Unable to perform the desired action.
    TalentNotRanked: Unable to add {talentName}; It is not a ranked talent, and you already have it!
    NoSkillsCompendium: Skills compendium setting is empty! Attempting to use default skills compendium.
    MissingCompendium: Unable to load Skills Compendium '{name}'. Reconfigure the skills compendium in Genesys Settings.
    WrongCompendiumType: Configured Skills Compendium '{name}' is a {type} Compendium, not an Item Compendium! Reconfigure the skills compendium in Genesys Settings.
    NoSkillsInCompendium: Configured Skills Compendium '{name}' does not contain any skills. Reconfigure the skills compendium in Genesys Settings.
    CharacterWithNoSkills: Character was created with no initial skill data since none were found on the configured Skills Compendium.
    CannotDeleteCharacteristic: Cannot delete XP Journal Entry for characteristic '{characteristic}' - you must delete the advance to the next rank first!
    CannotDeleteSkill: Cannot delete XP Journal Entry for skill '{name}' - you must delete the advance to the next rank first!
    CannotAffordTalent: Cannot afford talent '{name}' ({cost}xp).
    CannotAffordRankedTalent: Cannot afford to increase talent '{name}' to rank {newRank} ({cost}xp).
    CannotDeleteExistingTalent: Cannot delete XP Journal Entry for increasing talent '{name}' to rank {rank} - you must delete the higher rank increases first!
    CannotDeleteInvalidTalentPyramid: Cannot delete XP Journal Entry for talent of rank {rank} to preserve the talent pyramid structure. Try deleting talents of higher rank first.
    CannotPurchaseTalentTier: Cannot purchase talents at tier {tier} - you must have at least {minimum} talents at rank {lowerTier} first.
    CannotReplaceArchetype: Cannot take the Archetype '{name}' - the Archetype can only change while the XP Journal holds nothing but the Starting XP. Undo its other entries first!
    CannotReplaceCareer: Cannot take the Career '{name}' - the Career can only change until a skill rank is bought. Undo the skill entries of the XP Journal first!
    NotEnoughStoryPoints: You can't spend Story Points you don't have!
    SelectOneTokenForAction: You need to selected a single token to perform this action.
    NoActorForCheck: Select a single token or assign yourself a character to roll this check.
    SelectNoneOrOneTokenForAction: You need to select no tokens, or a single token, to perform this action.
    InvalidTokenTypeForAction: The selected token is of an invalid type to perform this action.
    TokenIsNotCombatant: The selected token is not participating on the current combat.
    CannotClaimOppositeSlot: You can't claim this initiative slot with {name} - it's on the wrong side!
    SlotAlreadyClaimed: This initiative slot is already claimed.
    NoGMForExtraSlot: A GM must be online to roll the initiative of an extra slot.
    NoGMForStoryPoint: A GM must be online to spend a Story Point.
    CombatantHasNoActivationLeft: '{name} has no activation left this round.'
    NoGMForClaim: A GM must be online to claim an initiative slot.
    NoGMForUsedUpEffects: A GM must be online to remove the Aim {name}'s attack used up.
    NoGMForCastingStrain: A GM must be online to give {name} the strain of their spell.
    NotOwnerOfCombatant: You don't own this combatant.
    ActingGMTimedOut: The GM didn't answer in time. Check whether it went through before trying again.
    CannotSelectActor: You do not have sufficient permission to select this Actor.
    NoRoleMembersWithAppropriateSkills: There are no role members that have the appropriate skills to perform this action.
    TooManySuperCharacteristics: An actor can't have more than two super-characteristics. Unmark one first.
    UnusableWeapon: "{name} can't attack: it has {damage}." # e.g. Pistol can't attack: it has Major Damage.
    NoRankInSpellSkills: '{name} needs a rank in one of its skills to be cast: {skills}.' # e.g. Curse needs a rank in one of its skills to be cast: Arcana, Divine.

  # Dialogs Prompts
  Dialogs:
    ConfirmDelete:
      Title: Confirm Deletion
      Content: Delete {name}? This can't be undone.
    ConfirmUndoEntry:
      Title: Undo Entry
      Award: Undo the XP award "{reason}"?
      AwardWithoutReason: Undo this XP award?
      Characteristic: Undo the increase of {characteristic} to {rank}? {characteristic} goes back to {previous}.
      Skill: Undo the increase of {name} to rank {rank}? The skill goes back to rank {previous}.
      SkillNotFound: Undo the increase of {name} to rank {rank}? The skill isn't found on the character, so no rank is lowered.
      NewTalent: Undo the purchase of the talent {name}? The talent is deleted from the character.
      NewTalentNotFound: Undo the purchase of the talent {name}? The talent it bought isn't found on the character, so none is deleted.
      NewTalentNotLinked: >-
        Undo the purchase of the talent {name}? The talent it bought isn't found on the character: the {name} on the sheet
        isn't linked to this entry, and stays.
      TalentRank: Undo the increase of {name} to rank {rank}? The talent goes back to rank {previous}.
      TalentRankNotFound: Undo the increase of {name} to rank {rank}? The talent isn't found on the character, so no rank is lowered.
      XPGivenBack: The character gets back the {xp} XP it cost.
      XPTakenAway: The character loses the {xp} XP it gave.
    ConfirmRemoveArchetype:
      Title: Remove Archetype
      Content: >-
        Removing {name} takes back the characteristics, wound and strain thresholds and Starting XP it gave, deletes the items
        it granted, and lowers each skill it granted by one rank. Do you want to proceed?
    ConfirmRemoveCareer:
      Title: Remove Career
      Content: Removing {name} unmarks its career skills and takes back the Free Ranks it gave them. Do you want to proceed?

  # Migration Related Messages
  Migration:
    MustPerformMigration: >-
      MIGRATION NEEDED!: Some data needs to be migrated and failure to do so might corrupt the data or break functionality.
      Please exit out of the world and wait for a GM to perform the migration.
    StartingMigration: 'MIGRATION STARTED: Commencing {amount} migration(s); please be patient and do not close the application.'
    StartingScriptMigration: 'MIGRATION STARTED [{id}]: Commencing migration.'
    StoppedScriptMigration: 'MIGRATION STOPPED [{id}]: Encountered an error while migrating.'
    CompletedScriptMigration: 'MIGRATION FINISHED [{id}]: Migration completed.'
    MultipleSuccessfulMigration: 'MIGRATION VERSION UPDATED: At least one migration was completed successfully.'
    StoppedMigration: >-
      MIGRATION STOPPED: The migration has stopped due to some errors; consult the console log for what these errors are.
      There are still {amount} migration(s) that haven't been performed.
    CompletedMigration: 'MIGRATION FINISHED: All migrations done; thanks for your patience.'
    UnpairedEffectCopies: >-
      {actor}: the effects of '{item}' don't match their copies on the actor. The copies were deleted, but the edits made to
      them from the actor's Effects tab weren't kept on the item.

  # Alpha Notice: the welcome message a GM reads when the system runs a new version
  AlphaNotice:
    Title: Genesys Alpha {version}
    Welcome: >-
      Hello! Thank you for giving the Genesys system a try! Please note that this system is currently in an alpha state; it is ready
      for some early playtesting and experimentation, but there are many features that are yet unimplemented and may be bugs!
    Updates: Bug Fixes & Updates
    Fix: FIX
    Feature: FEATURE
    Spells: >-
      Spells and their Additional Effects, cast from the Magic tab: the effects picked in the Dice Prompt, magic attacks with
      their damage, and Heal
    Attachments: >-
      Attachments install on a weapon or an armor, within its hard points, and their Active Effects can change the item
      itself
    Qualities: A quality dropped on an item brings its Active Effects, scaled by its rank
    Maneuvers: Aim, Guarded Stance, cover and prone change the combat checks they affect
    TokenStates: Immobilized, Disoriented and Staggered are token states, with their durations
    Thresholds: An actor past their wound or strain threshold is marked incapacitated or defeated
    CriticalInjuries: Critical Injuries roll on the world's table, from the attack card or the sheet
    Healing: >-
      Medicine heals a patient from its card, and characters recover strain after an encounter and after a night's rest
    StoryPointSpends: Story Points are spent from the Dice Prompt
    Hindrances: Encumbrance and a damaged weapon add their dice to the checks they hinder
    FrenchNames: The French names of Guarded Stance, cover and the strategic range follow the French edition
    ReleaseNotes: All the changes of {version}
    UsefulLinks: Useful Links
    Documentation: Project Documentation
    SourceCode: Project Source Code
    ReportBugs: Report Bugs & Suggest Features
    License: Licensed under the MIT License

  # Story Points
  StoryPoints:
    Player: Player Story Points
    GM: GM Story Points
    PlayerShort: Players
    GMShort: GM
    Reset: Reset Story Points
    Spend: Spend a Story Point
    # The name of a pool's count, which spends one of its points on a click: "GM Story Points: 4".
    PoolCount: '{pool}: {count}'
    ChatMessageGmPool: Spending a GM Story Point!
    ChatMessagePlayerPool: Spending a Player Story Point!

  # A value counted up from 0, stepped with − and +: its buttons, and the names of the sheets' counters.
  Counter:
    Decrease: Decrease
    Increase: Increase
    CurrentWounds: Current Wounds
    CurrentStrain: Current Strain
    CurrentHullTrauma: Current Hull Trauma
    CurrentSystemStrain: Current System Strain
    Damage: Damage

  # Localized strings used in TextEditor enrichers.
  Enrichers:
    Difficulty: '{difficulty} [{symbols}] {skill} check' # e.g. Average [♦♦] Coercion Check
    Opposed: 'Opposed {skill1} versus {skill2} check'

  # Combat Tracker
  CombatTracker:
    RevokeInitiativeClaim: Revoke Initiative Claim
    ClaimInitiativeSlot: Claim This Initiative Slot
    InitiativeSlot:
      pc: PC Slot
      npc: NPC Slot

  # Sheet Tab names
  Tabs:
    Skills: Skills
    Combat: Combat
    Talents: Talents
    Magic: Magic
    Inventory: Inventory
    Effects: Effects
    Journal: Journal
    Description: Description
    Data: Data
    Details: Details
    Miscellaneous: Miscellaneous
    Crew: Crew

  # Characteristics
  Characteristics:
    Brawn: Brawn
    Agility: Agility
    Intellect: Intellect
    Cunning: Cunning
    Willpower: Willpower
    Presence: Presence

  # Characteristic Abbreviations
  CharacteristicAbbr:
    Brawn: Br
    Agility: Ag
    Intellect: Int
    Cunning: Cun
    Willpower: Will
    Presence: Pr

  # Skill Categories
  SkillCategory:
    General: General
    Magic: Magic
    Combat: Combat
    Social: Social
    Knowledge: Knowledge

  # The magic action a spell performs (CRB pp. 214–218)
  SpellAction:
    Attack: Attack
    Augment: Augment
    Barrier: Barrier
    Conjure: Conjure
    Curse: Curse
    Dispel: Dispel
    Heal: Heal
    Utility: Utility
    Custom: Custom

  # Archetype Data
