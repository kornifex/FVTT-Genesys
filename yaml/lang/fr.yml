  # Notification Prompts
  Notifications:
    GenericError: Unable to perform the desired action.
    TalentNotRanked: "Impossible d'ajouter {talentName} : c'est un talent sans rang, et vous le possédez déjà !"
    NoSkillsCompendium: Le paramètre du compendium de compétences est vide ! Tentative d'utilisation du recueil de compétences par défaut.
    MissingCompendium: "Impossible de charger le compendium de compétences '{name}'. Reconfigurez le compendium de compétences dans la 'configuration des options' -> Genesys."
    WrongCompendiumType: "Le compendium de compétences configuré '{name}' est un compendium de {type} Compendium, pas un Compendium d'objet ! Reconfigurez le recueil de compétences dans la 'configuration des options' -> Genesys."
    NoSkillsInCompendium: Le compendium de compétences configuré '{name}' ne contient aucune compétence. Reconfigurez le recueil de compétences dans la configuration des options -> Genesys.
    CharacterWithNoSkills: Le personnage a été créé sans compétence initiale, car le compendium de compétences configuré n'en contient aucune.
    CannotDeleteCharacteristic: Impossible de supprimer l'entrée de journal XP pour la caractéristique '{characteristic}' - vous devez d'abord supprimer l'avancement au rang suppérieur !
    CannotDeleteSkill: Impossible de supprimer l'entrée du journal d'XP pour la compétence '{name}' - vous devez d'abord supprimer l'entrée du passage au rang suivant.!"
    CannotAffordTalent: "Impossible d'augmenter le talent '{name}' ({cost}xp)."
    CannotAffordRankedTalent: "Impossible d'augmenter le talent '{name}' au rang {newRank} ({cost}xp)."
    CannotDeleteExistingTalent: "Impossible de supprimer l'entrée du journal de XP pour l'augmentation du talent '{name}' au rang {rank} - Vous devez d'abord supprimer les augmentations de rang supérieur !"
    CannotDeleteInvalidTalentPyramid: Cannot delete XP Journal Entry for talent of rank {rank} to preserve the talent pyramid structure. Try deleting talents of higher rank first.
    CannotPurchaseTalentTier: "Vous ne pouvez prendre des talents de catégorie {tier} - vous devez avoir au moins {minimum} talents de catégorie {lowerTier} d'abord"
    CannotReplaceArchetype: "Impossible de prendre l'archétype '{name}' : l'archétype ne peut changer que si le Journal des XP ne contient rien d'autre que l'XP de départ. Annulez d'abord ses autres entrées !"
    CannotReplaceCareer: "Impossible de prendre la carrière '{name}' : la carrière ne peut plus changer une fois un rang de compétence acheté. Annulez d'abord les entrées de compétence du Journal des XP !"
    NotEnoughStoryPoints: Vous ne pouvez pas dépenser de Point Narratif que vous ne possédez pas!
    SelectOneTokenForAction: Vous devez selectionner un unique token pour réaliser cette action.
    NoActorForCheck: Sélectionnez un seul token ou attribuez-vous un personnage pour faire ce test.
    SelectNoneOrOneTokenForAction: Sélectionnez un seul token, ou aucun, pour faire cette action.
    InvalidTokenTypeForAction: Le token sélectionné est d'un type invalide pour réaliser cette action.
    TokenIsNotCombatant: Le token selectionné n'est pas dans le combat actuel.
    CannotClaimOppositeSlot: Vous ne pouvez par réclamer ce slot d'intiative avec {name} - il est du mauvais coté!
    SlotAlreadyClaimed: Ce slot d'initiative est déjà réclamé.
    NoGMForExtraSlot: Un MJ doit être connecté pour lancer l'initiative d'un slot supplémentaire.
    NoGMForStoryPoint: Un MJ doit être connecté pour dépenser un Point Narratif.
    CombatantHasNoActivationLeft: "{name} n'a plus d'activation ce round."
    NoGMForClaim: Un MJ doit être connecté pour réclamer un slot d'initiative.
    NotOwnerOfCombatant: Vous n'êtes pas propriétaire de ce combattant.
    ActingGMTimedOut: Le MJ n'a pas répondu à temps. Vérifiez si l'action a eu lieu avant de réessayer.
    CannotSelectActor: Vous n'avez pas assez de droit pour choisir cet Acteur.
    NoRoleMembersWithAppropriateSkills: Aucun membre du groupe pour ce rôle ne possède les compétences appropriées pour faire cette action.
    TooManySuperCharacteristics: Un acteur ne peut pas avoir plus de deux super-caractéristiques. Retirez-en une d'abord.

  # Dialogs Prompts
  Dialogs:
    ConfirmDelete:
      Title: Confirmer la suppression
      Content: Supprimer {name} ? Cette action est irréversible.
    ConfirmUndoEntry:
      Title: Annuler l'entrée
      Award: Annuler l'attribution d'XP « {reason} » ?
      AwardWithoutReason: Annuler cette attribution d'XP ?
      Characteristic: Annuler l'augmentation de {characteristic} à {rank} ? {characteristic} revient à {previous}.
      Skill: Annuler l'augmentation de {name} au rang {rank} ? La compétence revient au rang {previous}.
      SkillNotFound: "Annuler l'augmentation de {name} au rang {rank} ? La compétence est introuvable sur le personnage : aucun rang ne baisse."
      NewTalent: Annuler l'achat du talent {name} ? Le talent est supprimé du personnage.
      NewTalentNotFound: "Annuler l'achat du talent {name} ? Le talent acheté est introuvable sur le personnage : aucun talent n'est supprimé."
      NewTalentNotLinked: >-
        Annuler l'achat du talent {name} ? Le talent acheté est introuvable sur le personnage : le talent {name} de la fiche
        n'est pas lié à cette entrée, et est conservé.
      TalentRank: Annuler l'augmentation de {name} au rang {rank} ? Le talent revient au rang {previous}.
      TalentRankNotFound: "Annuler l'augmentation de {name} au rang {rank} ? Le talent est introuvable sur le personnage : aucun rang ne baisse."
      XPGivenBack: Le personnage récupère les {xp} XP dépensés.
      XPTakenAway: Le personnage perd les {xp} XP attribués.
    ConfirmRemoveArchetype:
      Title: Retirer l'archétype
      Content: >-
        Retirer {name} reprend les caractéristiques, les seuils de blessures et de stress et l'XP de départ qu'il a donnés,
        supprime les objets qu'il a accordés et baisse d'un rang chaque compétence qu'il a accordée. Voulez-vous continuer ?
    ConfirmRemoveCareer:
      Title: Retirer la carrière
      Content: >-
        Retirer {name} enlève la marque de carrière de ses compétences et reprend les rangs gratuits qu'elle leur a donnés.
        Voulez-vous continuer ?

  # Migration Related Messages
  Migration:
    MustPerformMigration: >-
      MIGRATION NEEDED!: Some data needs to be migrated and failure to do so might corrupt the data or break functionality.
      Please exit out of the world and wait for a GM to perform the migration.
    StartingMigration: 'MIGRATION STARTED: Commencing {amount} migration(s); please be patient and do not close the application.'
    StartingScriptMigration: 'MIGRATION STARTED [{id}]: Commencing migration.'
    StoppedScriptMigration: 'MIGRATION STOPPED [{id}]: Encountered an error while migrating.'
    CompletedScriptMigration: 'MIGRATION FINISHED [{id}]: Migration completed.'
    MultipleSuccessfulMigration: 'MIGRATION VERSION UPDATED: At least one migration was completed successfully.'
    StoppedMigration: >-
      MIGRATION STOPPED: The migration has stopped due to some errors; consult the console log for what these errors are.
      There are still {amount} migration(s) that haven't been performed.
    CompletedMigration: 'MIGRATION FINISHED: All migrations done; thanks for your patience.'
    UnpairedEffectCopies: >-
      {actor} : les effets de « {item} » ne correspondent pas à leurs copies sur l'acteur. Les copies ont été supprimées,
      mais les modifications qui leur avaient été apportées depuis l'onglet Effets de l'acteur n'ont pas été reportées sur l'objet.

  # Alpha Notice: the welcome message a GM reads when the system runs a new version
  AlphaNotice:
    Title: Genesys Alpha {version}
    Welcome: >-
      Bonjour, et merci d'essayer le système Genesys ! Notez que ce système est encore en version alpha : il est prêt pour de
      premières parties d'essai et quelques expérimentations, mais de nombreuses fonctionnalités manquent encore et des bugs
      sont possibles !
    Updates: Corrections et nouveautés
    Fix: CORRECTIF
    Feature: NOUVEAUTÉ
    Styling: STYLE
    RowMenu: >-
      Les actions d'une ligne sont dans son menu ⋮, dont ranger un objet dans un conteneur ou affecter un membre d'équipage
      à un rôle ; toute suppression demande confirmation
    Keyboard: Les fiches, leurs menus et les fenêtres de saisie s'utilisent au clavier, avec un contour de focus visible
    RollFromName: Le nom d'une ligne lance son test et son icône ouvre sa fiche, sur toutes les fiches
    Counter: >-
      Blessures et stress se changent avec un même compteur compact ; les blessures s'arrêtent partout au double du seuil
    ActingGmQueries: >-
      Le joueur est prévenu quand une action que le client du MJ exécute échoue, comme réclamer un emplacement d'initiative
      sans MJ connecté
    PilotDefensiveDriving: La Conduite défensive du pilote s'ajoute à la défense du véhicule, toujours plafonnée à 4
    ChatMode: Le message d'un test suit le mode du chat (aveugle, privé) sur Foundry v14 aussi
    Contrast: >-
      Tous les textes atteignent un contraste de 4.5:1 dans les deux Styles ; un effet désactivé et le camp d'un
      emplacement d'initiative le disent en toutes lettres
    ReleaseNotes: Tous les changements de la {version}
    UsefulLinks: Liens utiles
    Documentation: Documentation du projet
    SourceCode: Code source du projet
    ReportBugs: Signaler un bug ou proposer une fonctionnalité
    License: Sous licence MIT

