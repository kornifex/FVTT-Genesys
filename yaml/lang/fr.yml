      Skill: 'Jet de <strong>{skill} ({characteristic}<i class="fas fa-star {superChar}"></i>)</strong>...'
      SkillWithoutCharacteristic: Jet direct <strong>{skill}</strong>...
      AttackCharacteristic: Attaque avec un(e) <strong>{name}</strong> en utilisant <strong>{characteristic}</strong>!
      AttackSkill: 'Attaque avec un(e) <strong>{name}</strong> en utilisant <strong>{skill} ({characteristic}<i class="fas fa-star {superChar}"></i>)</strong>!'
      AttackSkillWithoutCharacteristic: Attaque avec un(e) <strong>{name}</strong> en utilisant <strong>{skill}</strong>!
    Attack:
