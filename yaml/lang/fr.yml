TYPES:
  Actor:
    character: Personnage
    minion: Sbire
    rival: Rival
    nemesis: Némésis
    vehicle: Vehicule

  Item:
    # Character Creation Items
    ability: Aptitude spéciale
    archetype: Archétype
    career: Carrière
    injury: Blessure critique
    skill: Compétence
    talent: Talent

    # Magic Items
    additionalEffect: Effet supplémentaire
    spell: Sort

    # Equipment Items
    armor: Armure
    attachment: Accessoire
    consumable: Consommable
    container: Conteneur
    gear: Equipement
    quality: Attribut d'objet
    weapon: Arme
    vehicleWeapon: Arme de véhicule

# Genesys
Genesys:
  # System Strings
  System:
    Name: Genesys

  # System Settings
  Settings:
    SkillsCompendium: Compendium des compétences
    SkillsCompendiumHint: "Un compendium d'objets contenant l'ensemble des compétences qui peuvent être ajoutées à un nouveau personnage. Changer cette valeur n'a pas d'effet rétroactif sur les anciens personnages"
    DefaultDifficulty: Difficulté par défaut
    DefaultDifficultyHint: >-
      The default dice pool modifications that should be added to the dice pool when doing a check. This default might be ignored in cases were the difficulty is known.
      For an explanation of all the possible modifications and their glyph please check [[Dice-Pool-Modification-Glyphs|Dice Pool Modification Glyphs]].
    Money: Monnaie
    MoneyHint: "Le nom de la monnaie (comme l'or, les crédits, le cash, les doublons, etc.) utilisée pour l'argent du système"
    CareerSkillRanks: Nombre de compétences de carrière
    CareerSkillRanksHint: Nombre de compétences que vous pouvez sélectionner dans la liste des compétences de carrière pendant la création du personnage
    UncoupleSkillsAlternateRule: Désolidariser les compétences des caractéristiques
    UncoupleSkillsAlternateRuleHint: "Autorise la sélection d'une caractéristique pour une compétence au moment de la boite de dialogue de lancement des dés, pour permettre la règle optionnelle 'Désolidariser les compétences des caractéristiques' (livre de base p 205)."
    ShowDamageOnFailure: "Montrer les dommages de l'attaque en cas d'échec"
    ShowDamageOnFailureHint: "Afficher ou non les dégâts et le critique sur les cartes de discussion des jets d'attaque, même en cas d'échec. Les attributs s'affichent toujours, car certains se déclenchent sur un échec."
    SkillForInjuries: Compétence du jet de Récupération
    SkillForInjuriesHint: "Nom de la compétence utilisée pour se remettre d'une blessure critique."
    SkillForRepairingVehicleHits: Compétence mécanique utilisée
    SkillForRepairingVehicleHitsHint: Nom de la compétence utilisée pour récupérer des dommages critiques.
    SkillForHealingWounds: Nom de la compétence Médecine
    SkillForHealingWoundsHint: "Nom de la compétence dont le jet soigne les blessures d'un patient, et à côté de laquelle s'affiche l'action Soigner."
    SkillForRecoveringStrain: Nom de la compétence Discipline
    SkillForRecoveringStrainHint: "Nom de la première des deux compétences entre lesquelles le jet qui récupère du stress à la fin d'une rencontre choisit ; elle l'emporte en cas d'égalité."
    AlternativeSkillForRecoveringStrain: Nom de la compétence Sang-froid
    AlternativeSkillForRecoveringStrainHint: "Nom de la seconde des deux compétences entre lesquelles le jet qui récupère du stress à la fin d'une rencontre choisit."
    DicePoolCollapseModifications: Collapse the Pool Modifications Section
    DicePoolCollapseModificationsHint: If enabled the 'Pool Modifications' section on the dice pool prompt will be collapsed during the initial render.
    DicePoolAutoApplyModifications: Auto-Apply Pool Modifications
    DicePoolAutoApplyModificationsHint: If enabled all the modifications that can affect the dice pool will be applied when opening the dice pool prompt.
    DicePoolChanceToSucceedByPermutation: Calcul les chances de succès pour ce pool.
    DicePoolChanceToSucceedByPermutationHint: >-
      Si cette option est activée, elle génère un Web Worker qui calcule les chances exactes de réussite.
      Toutefois, si le jeu de dés utilise une supercaractéristique, la valeur calculée est inférieure à la valeur réelle car elle suppose que le jeu n'explose pas.
      Pour les pools de dés qui utilisent des super caractéristiques, vous pouvez obtenir une valeur plus précise en utilisant des simulations.
    DicePoolChanceToSucceedBySimulation: Chance de succès approximative du Pool de dés
    DicePoolChanceToSucceedBySimulationHint: >-
      Le nombre de jets simulés à effectuer afin d'approximer les chances de réussite.
      Soyez prudent lorsque vous augmentez ce nombre car il aura un impact direct sur les performances de Foundry ; une bonne valeur de départ est 100. Si une valeur de 0 est fournie, cette fonctionnalité est désactivée.
      Ce paramètre est ignoré si les chances sont déjà calculées d'une autre manière.
    SuperCharacteristics: Super-Characteristiques
    SuperCharacteristicsHint: Permet de marquer des caractéristiques comme étant "super" lors de la création du personnage, selon la règle optionnelle des super-caractéristiques (Core Rulebook, p.251).
    IgnoreTalentPyramid: Ignorer la pyramide des talents
    IgnoreTalentPyramidHint: "Règle maison : permet d'acheter des talents de n'importe quelle catégorie sans avoir assez de talents de la catégorie inférieure."
    TalentTierVersions: Versions de talent par catégorie
    TalentTierVersionsHint: "Règle maison : chaque catégorie d'un talent à rangs est un item distinct portant le même nom. Glisser l'une de ces versions sur un personnage qui possède déjà le talent achète un rang au prix de la catégorie de cette version × 5 XP, dans n'importe quel ordre, et le bouton d'augmentation de rang est masqué."
    Style: Style
    StyleHint: 'Les couleurs des fiches et des fenêtres, pour tous les utilisateurs. Seules les couleurs changent, jamais la mise en page.'
    StyleGenesys: Genesys
    StyleTerrinoth: Royaumes de Terrinoth
    CountError: doit être un nombre entier, 0 ou plus
    DefaultDifficultyError: doit être fait de glyphes de modification de la réserve de dés

  # Tooltips
  Tooltips:
    NoDescription: Aucune description disponible
    SkillDifficulty: >-
      La difficulté à laquelle la réserve de dés s'ouvre pour cette compétence, en symboles de modification de réserve (DD pour Moyen). Laissez vide pour la difficulté par défaut du monde. Seule la compétence du compendium des compétences compte.
    HardPoints: >-
      La moitié de l'encombrement de base, arrondie au supérieur (livre de base, p. 206). Changez-la pour un objet qui fait exception ; videz le champ pour revenir à la valeur calculée.
    IsInitiative: Si la compétence est utilisée pour l'initiative ou non. En mettant cette valeur à VRAI, elle apparaîtra comme une option dans le traqueur de combat pour les jets de masse.
    CycleInitiativeSkill: Cycle de la compétence d'initiative utilisée par le combattant.
    AddExtraInitiativeSlot: Ajoute un slot supplémentaire pour l'initiative.
    Details: Détails
    OpenSkill: Ouvrir la fiche de la compétence
    OpenItem: Ouvrir la fiche de l'objet
    OpenActor: Ouvrir la fiche de l'acteur
    RollSkill: Lancer {skill}
    RollAttack: Attaquer avec {weapon}
    CastSpell: Lancer {spell}
    RollHealing: Lancer {skill} pour soigner {injury}
    RollRepair: Lancer {skill} pour réparer {hit}
    RollCharacteristic: Lancer {characteristic}

