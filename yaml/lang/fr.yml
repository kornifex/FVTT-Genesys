      Label: "Résultat de l'attaque"
      Damage: Dommage
      Qualities: "Attributs de l'arme"
    Summary:
      Label: Résumé
      Successes: Succès
      Failures: Echec
      Advantage: Avantage
      Threat: Menace
      Triumph: Triomphe
      Despair: Désastre

