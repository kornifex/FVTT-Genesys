      Difficulty: 'Difficulté : {level}'
      ManualChanges: Modifications manuelles
      SelfEffects: 'Soi : '
      TargetEffects: 'Cible : '
      EffectOfItem: '{effect} ({item})'
      OpenSource: Ouvrir {name}
      SilhouetteDifference: Gabarit ({target} contre {attacker})
